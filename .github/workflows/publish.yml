name: publish

# Tag-triggered release: push a vX.Y.Z tag (e.g. v0.1.0) to build, test, assemble the
# cross-platform package and publish it to nuget.org plus a GitHub release. The version
# is derived from the tag — the single source of truth — not from the csproj.
# Publish uses NuGet Trusted Publishing (OIDC): no long-lived API key in secrets; the
# short-lived key is exchanged by NuGet/login@v1. Register the matching policy on
# nuget.org (owner: ghostflyby, repo: ghostflyby/Pty.Net, workflow file: publish.yml).
on:
  push:
    tags: ['v*.*.*']

# A publish must never be cancelled mid-flight (a half-pushed release), and two pushes
# of the same tag cannot happen — but guard anyway: same-ref publishes serialize.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# Every run: step uses pwsh (PowerShell Core), preinstalled on all three runners, so
# the same script syntax works on Windows, macOS, and Linux — no bash-isms anywhere.
defaults:
  run:
    shell: pwsh

jobs:
  build:
    # One build per OS: the compiled dll is platform-specific but architecture-neutral
    # managed IL (the csproj splits files by OS only, and macOS arm64, Linux arm64, and
    # qemu-degraded x64 are all verified in CI). The publish job below copies each OS
    # build into both of its architecture RID folders, so no arch matrix is needed.
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set version from tag
        run: |
          "VERSION=$($env:GITHUB_REF_NAME -replace '^v','')" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      # A release candidate must pass the full suite on the OS whose dll it ships.
      - name: Test
        run: dotnet test Pty.Net.slnx -c Release --nologo

      - name: Pack
        run: dotnet pack Pty.Net/Pty.Net.csproj -c Release --nologo -o pkg -p:Version=$env:VERSION

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.os }}
          path: pkg/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to nuget.org + GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # id-token: write lets NuGet/login exchange the OIDC token for a short-lived NuGet
    # API key (Trusted Publishing); contents: write is for gh release create.
    permissions:
      id-token: write
      contents: write
    steps:
      # gh release create resolves the repository through git, so this job needs the
      # checkout even though it builds nothing (artifacts come from the build jobs).
      - uses: actions/checkout@v7

      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: pkgs
          pattern: pkg-*
          merge-multiple: false

      - name: Validate tag is SemVer and not a downgrade
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          "VERSION=$version" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
              throw "tag '$env:GITHUB_REF_NAME' is not a valid vX.Y.Z[(-suffix)] version"
          }
          # 'gh release list' exits 1 when no release exists yet (first publish); with
          # $PSNativeCommandUseErrorActionPreference = $true that becomes a terminating
          # error, so wrap it. The catch must also reset $LASTEXITCODE: pwsh exits the
          # script with the last external command's code, so a swallowed '1' would still
          # fail the step.
          $latest = try {
              gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>$null
          } catch {
              $global:LASTEXITCODE = 0
              $null
          }
          if ($latest) {
              function Test-Newer([string]$candidate, [string]$previous) {
                  $c = $candidate -split '-'; $p = $previous -split '-'
                  $cNum = [version]$c[0]; $pNum = [version]$p[0]
                  if ($cNum -gt $pNum) { return $true }
                  if ($cNum -lt $pNum) { return $false }
                  $cPre = if ($c.Count -gt 1) { $c[1] } else { '' }
                  $pPre = if ($p.Count -gt 1) { $p[1] } else { '' }
                  if ($pPre -eq '' -and $cPre -ne '') { return $false }   # 1.0.0-beta < 1.0.0
                  if ($cPre -eq '' -and $pPre -ne '') { return $true }
                  return $cPre -gt $pPre
              }
              $latestV = $latest -replace '^v', ''
              if (-not (Test-Newer $version $latestV)) {
                  throw "version '$version' is not newer than the latest release '$latestV'"
              }
              Write-Host "ok: $version > $latestV"
          } else {
              Write-Host 'no previous release; this is the first publish'
          }
          # Normal path ends cleanly even if an external command left $LASTEXITCODE set;
          # throw paths above terminate with a non-zero exit before reaching here.
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Assemble cross-platform nupkg
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $version = $env:VERSION
          New-Item -ItemType Directory -Force -Path 'merged/lib/net10.0' | Out-Null
          # Each OS build fills both of its architecture RID folders (see build job).
          $rids = @{
            'pkg-windows-latest' = @('win-x64','win-arm64')
            'pkg-ubuntu-latest'  = @('linux-x64','linux-arm64')
            'pkg-macos-latest'   = @('osx-x64','osx-arm64')
          }
          foreach ($art in $rids.Keys) {
            $nupkg = Get-ChildItem -Path "pkgs/$art" -Filter '*.nupkg' -Recurse | Select-Object -First 1
            if (-not $nupkg) { throw "no nupkg found in $art" }
            $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
            $entry = $zip.Entries | Where-Object { $_.FullName -like 'lib/net10.0/*.dll' } | Select-Object -First 1
            if (-not $entry) { $zip.Dispose(); throw "no lib dll in $($nupkg.Name)" }
            $tmp = [System.IO.Path]::GetTempFileName()
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $tmp, $true)
            $zip.Dispose()
            try {
              foreach ($rid in $rids[$art]) {
                New-Item -ItemType Directory -Force -Path "merged/lib/net10.0/$rid" | Out-Null
                Copy-Item -LiteralPath $tmp -Destination "merged/lib/net10.0/$rid/Ghostflyby.Pty.dll" -Force
              }
            } finally { Remove-Item -LiteralPath $tmp -Force -ErrorAction SilentlyContinue }
          }
          # Root package structure (nuspec, rels, content-types) from any single package.
          $base = Get-ChildItem -Path pkgs -Filter '*.nupkg' -Recurse | Select-Object -First 1
          $zip = [System.IO.Compression.ZipFile]::OpenRead($base.FullName)
          try {
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName -like 'lib/*') { continue }
              $dest = Join-Path 'merged' $entry.FullName
              New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $dest, $true)
            }
          } finally { $zip.Dispose() }
          Compress-Archive -Path 'merged/*' -DestinationPath "Ghostflyby.Pty.$version.nupkg" -Force

      - name: Verify assembled package
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("Ghostflyby.Pty.$env:VERSION.nupkg")
          try {
            $dlls = @($zip.Entries | Where-Object { $_.FullName -like 'lib/net10.0/*/Ghostflyby.Pty.dll' })
            if ($dlls.Count -ne 6) {
              $zip.Entries | Where-Object { $_.FullName -like 'lib/net10.0/*' } | ForEach-Object { Write-Host $_.FullName }
              throw "expected 6 RID-specific dlls, found $($dlls.Count)"
            }
            $nuspec = @($zip.Entries | Where-Object { $_.FullName -like '*.nuspec' })
            if ($nuspec.Count -ne 1) { throw "expected exactly one nuspec, found $($nuspec.Count)" }
          } finally { $zip.Dispose() }

      # Pre-publish gate: consume the assembled package from a local source exactly like
      # a user would, before anything is pushed. This proves the RID layout resolves on
      # this platform (linux-x64), the nuspec/metadata are intact, and a real pty session
      # runs. A failure here aborts the release.
      - name: Smoke test the assembled package (pre-publish gate)
        run: "& .github/workflows/smoke.ps1 -SourceDir ."

      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          # nuget.org username (profile name), not an email address. The temp key is
          # valid for 1 hour and is exchanged right before the push.
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        run: dotnet nuget push "Ghostflyby.Pty.$env:VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate

      - name: Create GitHub release
        run: |
          gh release create "$env:GITHUB_REF_NAME" --title "$env:GITHUB_REF_NAME" `
            --notes "Cross-platform pty library — see https://www.nuget.org/packages/Ghostflyby.Pty/$env:VERSION for package details." `
            "Ghostflyby.Pty.$env:VERSION.nupkg"
        env:
          GH_TOKEN: ${{ github.token }}

  smoke:
    # Post-publish verification: consume the artifact that actually shipped (downloaded
    # from the GitHub release) on a real arm64 runner. This proves the linux-arm64 RID
    # path resolves and the architecture-specific P/Invoke (AAPCS64 pad workaround) runs
    # from the packaged dll. It runs after publish, so a failure marks the run red for
    # manual review — the release itself has already happened.
    name: Post-publish smoke (${{ matrix.os }})
    needs: publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7 # for smoke.ps1

      - name: Download published package from release
        run: gh release download "$env:GITHUB_REF_NAME" --pattern '*.nupkg' --dir .
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Smoke test the published package
        run: "& .github/workflows/smoke.ps1 -SourceDir ."
