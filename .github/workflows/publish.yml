name: publish

# Tag-triggered release: push a vX.Y.Z tag (e.g. v0.1.0) to build, test, assemble the
# cross-platform package and publish it to nuget.org plus a GitHub release. The version
# is derived from the tag — the single source of truth — not from the csproj.
# Publish uses NuGet Trusted Publishing (OIDC): no long-lived API key in secrets; the
# short-lived key is exchanged by NuGet/login@v1. Register the matching policy on
# nuget.org (owner: ghostflyby, repo: ghostflyby/Pty.Net, workflow file: publish.yml).
on:
  push:
    tags: ['v*.*.*']

# A publish must never be cancelled mid-flight (a half-pushed release), and two pushes
# of the same tag cannot happen — but guard anyway: same-ref publishes serialize.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# Every run: step uses pwsh (PowerShell Core), preinstalled on all three runners, so
# the same script syntax works on Windows, macOS, and Linux — no bash-isms anywhere.
defaults:
  run:
    shell: pwsh

jobs:
  build:
    # One build per OS: the compiled dll is platform-specific but architecture-neutral
    # managed IL (the csproj splits files by OS only, and macOS arm64, Linux arm64, and
    # qemu-degraded x64 are all verified in CI). The publish job below copies each OS
    # build into both of its architecture RID folders, so no arch matrix is needed.
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set version from tag
        run: |
          "VERSION=$($env:GITHUB_REF_NAME -replace '^v','')" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      # A release candidate must pass the full suite on the OS whose dll it ships.
      - name: Test
        run: dotnet test --solution Pty.Net.slnx -c Release

      - name: Pack
        run: dotnet pack Pty.Net/Pty.Net.csproj -c Release --nologo -o pkg -p:Version=$env:VERSION

      - name: Upload platform package
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.os }}
          path: pkg/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to nuget.org + GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # id-token: write lets NuGet/login exchange the OIDC token for a short-lived NuGet
    # API key (Trusted Publishing) and signs the build attestation; attestations: write
    # persists that attestation in the repository's attestation store (missing it fails
    # the step with "Resource not accessible by integration"); contents: write is for
    # gh release create; pull-requests: write lets the housekeeping step create +
    # auto-merge its PR. Requires the repo setting "Allow GitHub Actions to create and
    # approve pull requests" to be enabled, or the PR creation fails with "Resource
    # not accessible by integration (createPullRequest)".
    permissions:
      id-token: write
      attestations: write
      contents: write
      pull-requests: write
    steps:
      # gh release create resolves the repository through git, so this job needs the
      # checkout even though it builds nothing (artifacts come from the build jobs).
      # fetch-depth: 0 so the housekeeping step can fetch main and inspect the tag commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          path: pkgs
          pattern: pkg-*
          merge-multiple: false

      - name: Validate tag is SemVer and not a downgrade
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          "VERSION=$version" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
              throw "tag '$env:GITHUB_REF_NAME' is not a valid vX.Y.Z[(-suffix)] version"
          }
          # Refuse versions nuget.org already has, before anything builds. With
          # --skip-duplicate gone from the push this is the belt to its suspenders,
          # and it gives traceability-only tag pushes (a re-tag of a historical
          # version) a clear early exit instead of a full build that cannot be
          # pushed.
          $index = try { Invoke-RestMethod -Uri 'https://api.nuget.org/v3-flatcontainer/ghostflyby.pty/index.json' -TimeoutSec 30 } catch { $null }
          if ($index -and ($index.versions -contains $version)) {
              throw "version '$version' is already published on nuget.org — refusing to republish (traceability tag only)"
          }
          # The tag commit must sit on main's history: a tag on a side branch or a
          # stray commit never reaches the production publish.
          $onMain = $false
          try {
              git merge-base --is-ancestor "$env:GITHUB_SHA" origin/main 2>$null
              $onMain = ($LASTEXITCODE -eq 0)
          } catch {
              $global:LASTEXITCODE = 0
              $onMain = $false
          }
          if (-not $onMain) { throw "tag commit $env:GITHUB_SHA is not an ancestor of origin/main" }
          # And its CI must have passed: a release rides on the commit the
          # six-platform suite ran against.
          $run = try {
              gh run list --workflow ci.yml --commit "$env:GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>$null
          } catch {
              $global:LASTEXITCODE = 0
              $null
          }
          if (-not $run) { throw "no successful ci.yml run found for tag commit $env:GITHUB_SHA — tag before merging, not after" }
          Write-Host "ok: tag commit is on main with green CI (run $run)"
          # 'gh release list' exits 1 when no release exists yet (first publish); with
          # $PSNativeCommandUseErrorActionPreference = $true that becomes a terminating
          # error, so wrap it. The catch must also reset $LASTEXITCODE: pwsh exits the
          # script with the last external command's code, so a swallowed '1' would still
          # fail the step.
          $latest = try {
              gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>$null
          } catch {
              $global:LASTEXITCODE = 0
              $null
          }
          if ($latest) {
              function Test-Newer([string]$candidate, [string]$previous) {
                  $c = $candidate -split '-'; $p = $previous -split '-'
                  $cNum = [version]$c[0]; $pNum = [version]$p[0]
                  if ($cNum -gt $pNum) { return $true }
                  if ($cNum -lt $pNum) { return $false }
                  $cPre = if ($c.Count -gt 1) { $c[1] } else { '' }
                  $pPre = if ($p.Count -gt 1) { $p[1] } else { '' }
                  if ($pPre -eq '' -and $cPre -ne '') { return $false }   # 1.0.0-beta < 1.0.0
                  if ($cPre -eq '' -and $pPre -ne '') { return $true }
                  return $cPre -gt $pPre
              }
              $latestV = $latest -replace '^v', ''
              if (-not (Test-Newer $version $latestV)) {
                  throw "version '$version' is not newer than the latest release '$latestV'"
              }
              Write-Host "ok: $version > $latestV"
          } else {
              Write-Host 'no previous release; this is the first publish'
          }
          # Normal path ends cleanly even if an external command left $LASTEXITCODE set;
          # throw paths above terminate with a non-zero exit before reaching here.
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Assemble cross-platform nupkg
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $version = $env:VERSION
          New-Item -ItemType Directory -Force -Path 'merged/ref/net10.0' | Out-Null
          # Each OS build fills both of its architecture RID folders (see build job).
          #
          # NuGet layout, and why there is deliberately NO flat lib/net10.0:
          #   * runtimes/{rid}/lib/{tfm}/ carries the OS-specific implementation — the
          #     convention for RID-specific runtime assets (never lib/{tfm}/{rid}/,
          #     which NuGet treats as non-asset content).
          #   * ref/net10.0/ carries the compile-time reference. The public API surface
          #     is identical across the three OS builds (one shared PublicAPI.Shipped.txt
          #     contract; the OS files only add partial-class implementations), so any
          #     build's dll serves as the reference; Roslyn reads only its metadata and
          #     a ref/ asset is never executed at runtime.
          #   * A flat lib/net10.0/Ghostflyby.Pty.dll is NOT shipped: lib/ is also
          #     NuGet's runtime fallback when no runtimes/{rid}/ matches the consumer
          #     RID, which silently handed ios-arm64/browser-wasm a wrong-OS dll at
          #     runtime (verified against the published 0.2.2). With ref-only, an
          #     unsupported RID still restores for compilation but fails loudly at
          #     runtime instead of executing the wrong platform build — enforced by
          #     the restore-matrix step below.
          $rids = @{
            'pkg-windows-latest' = @('win-x64','win-arm64')
            'pkg-ubuntu-latest'  = @('linux-x64','linux-arm64')
            'pkg-macos-latest'   = @('osx-x64','osx-arm64')
          }
          $refCopied = $false
          foreach ($art in $rids.Keys) {
            $nupkg = Get-ChildItem -Path "pkgs/$art" -Filter '*.nupkg' -Recurse | Select-Object -First 1
            if (-not $nupkg) { throw "no nupkg found in $art" }
            $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
            $dll = $zip.Entries | Where-Object { $_.FullName -eq 'lib/net10.0/Ghostflyby.Pty.dll' } | Select-Object -First 1
            if (-not $dll) { $zip.Dispose(); throw "no lib/net10.0/Ghostflyby.Pty.dll in $($nupkg.Name)" }
            $tmpDll = [System.IO.Path]::GetTempFileName()
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($dll, $tmpDll, $true)
            try {
              foreach ($rid in $rids[$art]) {
                New-Item -ItemType Directory -Force -Path "merged/runtimes/$rid/lib/net10.0" | Out-Null
                Copy-Item -LiteralPath $tmpDll -Destination "merged/runtimes/$rid/lib/net10.0/Ghostflyby.Pty.dll" -Force
              }
              # Compile-time reference from the first OS processed (linux-x64 in the
              # stable hashtable order); see the layout comment above.
              if (-not $refCopied) {
                Copy-Item -LiteralPath $tmpDll -Destination 'merged/ref/net10.0/Ghostflyby.Pty.dll' -Force
                $refCopied = $true
              }
            } finally { Remove-Item -LiteralPath $tmpDll -Force -ErrorAction SilentlyContinue }
            # Doc metadata for IntelliSense next to the reference assembly.
            $xml = $zip.Entries | Where-Object { $_.FullName -eq 'lib/net10.0/Ghostflyby.Pty.xml' } | Select-Object -First 1
            if ($xml) {
              $tmpXml = [System.IO.Path]::GetTempFileName()
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($xml, $tmpXml, $true)
              try { Copy-Item -LiteralPath $tmpXml -Destination 'merged/ref/net10.0/Ghostflyby.Pty.xml' -Force }
              finally { Remove-Item -LiteralPath $tmpXml -Force -ErrorAction SilentlyContinue }
            }
            $zip.Dispose()
          }
          if (-not $refCopied) { throw 'no dll captured for the ref/ compile asset' }
          # Root package structure (nuspec, rels, content-types) from any single package.
          # lib/* is excluded — it is rebuilt as ref/ + runtimes/ above, and dropping it
          # is the whole point of this layout. ref/* is excluded because the unified
          # copy above is authoritative.
          $base = Get-ChildItem -Path pkgs -Filter '*.nupkg' -Recurse | Select-Object -First 1
          $zip = [System.IO.Compression.ZipFile]::OpenRead($base.FullName)
          try {
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName -like 'lib/*' -or $entry.FullName -like 'ref/*') { continue }
              $dest = Join-Path 'merged' $entry.FullName
              New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $dest, $true)
            }
          } finally { $zip.Dispose() }
          # ZipFile.CreateFromDirectory, not Compress-Archive: the pwsh wildcard
          # 'merged/*' skips hidden files on Unix, silently dropping _rels/.rels — the
          # OPC relationship file a NuGet package needs (nuget.org tolerates its absence,
          # but some tooling rejects it). CreateFromDirectory packs everything under
          # merged/ with contents at the archive root, including hidden files.
          [System.IO.Compression.ZipFile]::CreateFromDirectory('merged', "Ghostflyby.Pty.$version.nupkg")

      - name: Verify assembled package
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("Ghostflyby.Pty.$env:VERSION.nupkg")
          try {
            $dlls = @($zip.Entries | Where-Object { $_.FullName -like 'runtimes/*/lib/net10.0/Ghostflyby.Pty.dll' })
            if ($dlls.Count -ne 6) {
              $zip.Entries | Where-Object { $_.FullName -like 'runtimes/*' -or $_.FullName -like 'ref/*' -or $_.FullName -like 'lib/*' } | ForEach-Object { Write-Host $_.FullName }
              throw "expected 6 RID-specific runtimes dlls, found $($dlls.Count)"
            }
            $ref = @($zip.Entries | Where-Object { $_.FullName -eq 'ref/net10.0/Ghostflyby.Pty.dll' })
            if ($ref.Count -ne 1) { throw "expected exactly one ref/net10.0/Ghostflyby.Pty.dll, found $($ref.Count)" }
            $refXml = @($zip.Entries | Where-Object { $_.FullName -eq 'ref/net10.0/Ghostflyby.Pty.xml' })
            if ($refXml.Count -ne 1) { throw "expected exactly one ref/net10.0/Ghostflyby.Pty.xml, found $($refXml.Count)" }
            # The load-bearing guarantee of this layout: no flat implementation dll.
            # lib/ is NuGet's runtime fallback for unmatched RIDs, so any entry there
            # would silently execute a wrong-OS build on an unsupported platform.
            $flat = @($zip.Entries | Where-Object { $_.FullName -like 'lib/*' })
            if ($flat.Count -gt 0) {
              $flat | ForEach-Object { Write-Host $_.FullName }
              throw "found $($flat.Count) lib/ entries; the package must be ref/+runtimes/ only"
            }
            $nuspec = @($zip.Entries | Where-Object { $_.FullName -like '*.nuspec' })
            if ($nuspec.Count -ne 1) { throw "expected exactly one nuspec, found $($nuspec.Count)" }
          } finally { $zip.Dispose() }

      # The snupkg rides in with the per-OS build artifacts (pack emits it next to
      # the nupkg); one copy is pushed — see the csproj symbols note for why one
      # snupkg can only symbol-match the linux RIDs.
      - name: Pick the symbol package
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item "pkgs/pkg-ubuntu-latest/Ghostflyby.Pty.$env:VERSION.snupkg" -Destination .
          Get-Item "Ghostflyby.Pty.$env:VERSION.snupkg" | Write-Host

      # Real-consumption gate: the exact nupkg about to be pushed must restore on the
      # supported RIDs and must NOT hand runtime assets to unsupported ones. Uses a
      # local folder as the package source — no network, no push.
      - name: Restore matrix against the assembled package
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:VERSION
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/local-source" | Out-Null
          Copy-Item "Ghostflyby.Pty.$version.nupkg" "$env:RUNNER_TEMP/local-source/"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/consumer" | Out-Null
          Push-Location "$env:RUNNER_TEMP/consumer"
          try {
            $proj = @(
              '<Project Sdk="Microsoft.NET.Sdk">'
              '  <PropertyGroup>'
              '    <TargetFramework>net10.0</TargetFramework>'
              '    <Nullable>disable</Nullable>'
              '    <ImplicitUsings>enable</ImplicitUsings>'
              '  </PropertyGroup>'
              '  <ItemGroup>'
              '    <PackageReference Include="Ghostflyby.Pty" Version="__VERSION__" />'
              '  </ItemGroup>'
              '</Project>'
            ) -join "`n"
            $proj.Replace('__VERSION__', $version) | Set-Content -Path 'Consumer.csproj' -Encoding utf8
            'System.Console.WriteLine(typeof(Ghostflyby.Pty.PtyProcess).FullName);' |
              Set-Content -Path 'Class1.cs' -Encoding utf8
            $sourceArg = "--source:$env:RUNNER_TEMP/local-source", "--source:https://api.nuget.org/v3/index.json"
            # Supported RIDs: the runtime host must receive exactly the matching
            # runtimes/{rid} dll — no more, no less.
            foreach ($rid in 'win-x64','linux-x64','osx-arm64','linux-arm64','win-arm64','osx-x64') {
              dotnet restore -r $rid $sourceArg --nologo
              $assets = Get-Content 'obj/project.assets.json' -Raw | ConvertFrom-Json
              # A RID restore produces both the portable and the RID-specific target;
              # the RID-specific one is authoritative for what that RID executes: the
              # exact-RID asset is PROMOTED into `runtime` (its runtimeTargets stays
              # empty — this bit the first v0.3.0 publish attempt, whose check
              # asserted runtimeTargets non-empty and failed on a correct package).
              $pkg = $assets.targets."net10.0/$rid"."Ghostflyby.Pty/$version"
              if (-not $pkg) { throw "${rid}: package missing from restore targets" }
              if (-not $pkg.compile.'ref/net10.0/Ghostflyby.Pty.dll') { throw "${rid}: no compile asset — ref/ layout broken" }
              $runtime = @(@($pkg.runtime.PSObject.Properties.Name) | Where-Object { $_ }) # $pkg.runtime is ABSENT (null) for RIDs with no runtime asset; @($null...) would count 1
              if ($runtime.Count -ne 1 -or $runtime[0] -ne "runtimes/$rid/lib/net10.0/Ghostflyby.Pty.dll") {
                throw "${rid}: expected exactly runtimes/$rid/lib/net10.0/Ghostflyby.Pty.dll, got: $($runtime -join ', ')"
              }
              Write-Host "ok: $rid -> $($runtime[0])"
            }
            # Unsupported RIDs. NuGet's RID graph decides what they receive, not us:
            # ios-* and browser-wasm have no compatible asset and stay compile-only
            # (restore succeeds, execution fails loudly — the 0.2.2 defect); android-
            # arm64 INHERITS linux-arm64 through the graph (android ⊂ linux), so it
            # legitimately receives the linux-arm64 dll. All six shipped assemblies
            # are identical architecture-neutral managed IL, so that fallback is the
            # same bytes either way — assert the graph behavior, not absence.
            $unsupported = @{
              'ios-arm64'     = $null
              'browser-wasm'  = $null
              'android-arm64' = 'runtimes/linux-arm64/lib/net10.0/Ghostflyby.Pty.dll'
            }
            foreach ($rid in $unsupported.Keys) {
              dotnet restore -r $rid $sourceArg --nologo
              $assets = Get-Content 'obj/project.assets.json' -Raw | ConvertFrom-Json
              $pkg = $assets.targets."net10.0/$rid"."Ghostflyby.Pty/$version"
              if (-not $pkg) { throw "${rid}: package missing from restore targets" }
              if (-not $pkg.compile.'ref/net10.0/Ghostflyby.Pty.dll') { throw "${rid}: no compile asset — an unsupported RID must still restore for compilation" }
              $runtime = @(@($pkg.runtime.PSObject.Properties.Name) | Where-Object { $_ }) # $pkg.runtime is ABSENT (null) for RIDs with no runtime asset; @($null...) would count 1
              $expected = $unsupported[$rid]
              if ($expected) {
                if ($runtime.Count -ne 1 -or $runtime[0] -cne $expected) { throw "${rid}: expected $expected (RID-graph fallback), got: $($runtime -join ', ')" }
                Write-Host "ok: $rid -> $expected (RID-graph fallback)"
              } else {
                if ($runtime.Count -gt 0) { throw "${rid}: got runtime assets for an unsupported RID: $($runtime -join ', ')" }
                Write-Host "ok: $rid -> compile-only (no runtime asset)"
              }
            }
            # Portable restore (no RID): must succeed, compile asset from ref/,
            # and hand out no runtime asset at all (no flat lib/ fallback exists).
            dotnet restore $sourceArg --nologo
            $assets = Get-Content 'obj/project.assets.json' -Raw | ConvertFrom-Json
            $pkg = $assets.targets.'net10.0'."Ghostflyby.Pty/$version"
            if (-not $pkg) { throw 'portable: package missing from restore targets' }
            if (-not $pkg.compile.'ref/net10.0/Ghostflyby.Pty.dll') { throw 'portable: no compile asset — ref/ layout broken' }
            $runtime = @(@($pkg.runtime.PSObject.Properties.Name) | Where-Object { $_ }) # $pkg.runtime is ABSENT (null) for RIDs with no runtime asset; @($null...) would count 1
            if ($runtime.Count -gt 0) { throw "portable: unexpected runtime assets: $($runtime -join ', ')" }
            Write-Host 'ok: portable restore'
          } finally { Pop-Location }

      # Signed provenance for the exact artifacts about to be pushed: a consumer
      # (or nuget.org's UI) can verify these bytes were built by this repository's
      # workflow from this commit. Runs before the push so only artifacts that
      # passed every gate above get attested.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            Ghostflyby.Pty.${{ env.VERSION }}.nupkg
            Ghostflyby.Pty.${{ env.VERSION }}.snupkg

      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          # nuget.org username (profile name), not an email address. The temp key is
          # valid for 1 hour and is exchanged right before the push.
          user: ${{ secrets.NUGET_USER }}

      # No --skip-duplicate on the nupkg: a version that already exists must fail
      # loudly, not be silently dropped — two different artifacts for the "same"
      # version are exactly the accident this must never paper over. The
      # already-published guard in the validation step catches the re-tag case
      # before anything builds.
      #
      # The snupkg needs no separate command: since NuGet 7.0 (.NET 10) the client
      # automatically pushes the symbol package sitting next to the nupkg
      # (NuGet/Home#8016). On v0.3.1 an explicit second snupkg push after it hit
      # the fresh upload's validation lag — 409 "another copy pending validation" —
      # and failed the step after both files were already up.
      - name: Publish to nuget.org
        run: dotnet nuget push "Ghostflyby.Pty.$env:VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"

      - name: Create GitHub release
        run: |
          gh release create "$env:GITHUB_REF_NAME" --title "$env:GITHUB_REF_NAME" `
            --notes "Cross-platform pty library — see https://www.nuget.org/packages/Ghostflyby.Pty/$env:VERSION for package details." `
            "Ghostflyby.Pty.$env:VERSION.nupkg"
        env:
          GH_TOKEN: ${{ github.token }}

      # Publish-time housekeeping: the API shipped in this release must move from
      # Unshipped to Shipped, so Shipped stays an accurate record of what is published.
      # The exact set is the Unshipped entries present on the tag commit (this checkout),
      # merged into main's Shipped and removed from main's Unshipped — later additions on
      # main stay unshipped. main is protected (pull_request ruleset), so this opens an
      # auto-merged PR instead of pushing directly. The release itself is already done,
      # so a failure here just marks the run red for manual follow-up.
      - name: Move published API into Shipped (housekeeping PR)
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # The working tree is the tag commit: its Unshipped entries are what shipped.
          $tagUnshipped = @(Get-Content 'Pty.Net/PublicAPI.Unshipped.txt' | Where-Object { $_ -and -not $_.StartsWith('#') })
          if ($tagUnshipped.Count -eq 0) {
              Write-Host 'no unshipped API on this tag; nothing to move'
              exit 0
          }
          git fetch origin main
          git checkout -b "housekeeping/shipped-v$env:VERSION" FETCH_HEAD
          $shippedPath = 'Pty.Net/PublicAPI.Shipped.txt'
          $unshippedPath = 'Pty.Net/PublicAPI.Unshipped.txt'
          $shipped = @(Get-Content $shippedPath | Where-Object { $_ -and -not $_.StartsWith('#') })
          $unshipped = @(Get-Content $unshippedPath | Where-Object { $_ -and -not $_.StartsWith('#') })
          $removedPrefix = '*REMOVED*'
          $tagAdditions = @($tagUnshipped | Where-Object { -not $_.StartsWith($removedPrefix) })
          $tagRemovals = @($tagUnshipped | Where-Object { $_.StartsWith($removedPrefix) } | ForEach-Object { $_.Substring($removedPrefix.Length) })
          $remainingShipped = @($shipped | Where-Object { $_ -notin $tagRemovals })
          $newShipped = @(($remainingShipped + $tagAdditions) | Select-Object -Unique)
          $newUnshipped = @($unshipped | Where-Object { $_ -notin $tagUnshipped })
          # Sort by the stripped symbol key, matching the existing Shipped ordering.
          $key = { param($s) ($s -replace '^\*REMOVED\*', '') -replace '^(static |override )', '' }
          $newShipped = @($newShipped | Sort-Object -Property @{Expression = $key})
          $newUnshipped = @($newUnshipped | Sort-Object -Property @{Expression = $key})
          "#nullable enable`n$($newShipped -join "`n")`n" | Set-Content -Path $shippedPath -NoNewline
          "#nullable enable`n$($newUnshipped -join "`n")`n" | Set-Content -Path $unshippedPath -NoNewline
          git add $shippedPath $unshippedPath
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' `
            commit -m "chore: move shipped API to Shipped for $env:GITHUB_REF_NAME"
          git push -u origin "housekeeping/shipped-v$env:VERSION"
          gh pr create --base main --head "housekeeping/shipped-v$env:VERSION" `
            --title "chore: move shipped API to Shipped for $env:GITHUB_REF_NAME" `
            --body "Publish-time housekeeping: the API shipped in $env:GITHUB_REF_NAME moves from Unshipped to Shipped (the entries present on the tag commit)."
          gh pr merge --auto --merge
        env:
          GH_TOKEN: ${{ github.token }}
