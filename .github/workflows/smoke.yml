name: smoke

# Manual post-publish verification of the Ghostflyby.Pty package on nuget.org.
# Kept out of the publish workflow: the feed is eventually consistent, and a freshly
# pushed version becomes visible only after an unbounded, unobservable delay — so
# smoke cannot run in lockstep with the release (it would fail with NU1102, and
# there is no reliable way to wait for visibility). Trigger it manually once the
# version is confirmed available on nuget.org; a failure here flags a packaging
# problem that a release did not catch.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published Ghostflyby.Pty version to verify, e.g. 0.2.2'
        required: true
        type: string

# Every run: step uses pwsh (PowerShell Core), preinstalled on every runner in the
# matrix, so the same script syntax works on Windows, macOS, and Linux — no bash-isms
# anywhere.
defaults:
  run:
    shell: pwsh

jobs:
  package-smoke:
    # Same OS matrix as the CI test suite — one runner per shipped RID, so every
    # packaged runtime DLL (win-x64, win-arm64, linux-x64, linux-arm64, osx-x64,
    # osx-arm64) gets restored and exercised against nuget.org's copy, including the
    # architecture-specific P/Invoke paths.
    name: Package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7 # for Pty.Net.Smoke

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The consumer csproj defaults to 0.1.0 for local runs; the manual trigger
      # overrides it with the version being verified.
      - name: Smoke test the published package
        run: dotnet run --project Pty.Net.Smoke -c Release -p:GhostflybyPtyVersion=${{ inputs.version }}
