name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Report failures on every OS instead of letting one cancel the rest.
      fail-fast: false
      matrix:
        # windows-latest drives the suite against Git Bash (bundled with Git for Windows);
        # TestHelpers resolves bash.exe and the ConPTY paths are covered by
        # Pty.WindowsTests.cs plus the portable bash-driven tests.
        # ubuntu-24.04-arm is a native ARM64 runner (public preview). The Unix I/O path
        # calls the variadic libc ioctl via the pad-register workaround for the AAPCS64
        # variadic ABI (see NativeMethods.Unix.cs); that technique is proven on Apple
        # arm64 (macos-latest below is also arm64), and this native Linux arm64 run is
        # the gate for the glibc arm64 build.
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Pty.Net.slnx

      - name: Build
        run: dotnet build Pty.Net.slnx -c Release --no-restore --nologo

      - name: Verify platform split in the built DLL (Windows)
        # Ghostflyby.Pty.dll is a single-TFM artifact whose platform code is chosen at
        # compile time by the csproj file globs (Pty.Net.csproj). Type names are plain
        # UTF-8 in the metadata, so checking for their presence/absence proves this
        # build did not mix — or silently strip — the Windows and Unix halves.
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $text = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes('Pty.Net/bin/Release/net10.0/Ghostflyby.Pty.dll'))
          if (-not $text.Contains('WindowsPty')) { throw "Windows build is missing the ConPTY path" }
          if ($text.Contains('PtyIoEngine'))     { throw "Windows build contains the Unix I/O engine" }

      - name: Verify platform split in the built DLL (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          dll=Pty.Net/bin/Release/net10.0/Ghostflyby.Pty.dll
          if grep -a -q 'WindowsPty' "$dll"; then
            echo "error: Unix build contains the Windows ConPTY path"
            exit 1
          fi
          if ! grep -a -q 'PtyIoEngine' "$dll"; then
            echo "error: Unix build is missing the poll-driven I/O engine"
            exit 1
          fi

      - name: Test
        # The blame-hang collector is only meaningful on Windows, where ClosePseudoConsole
        # can block indefinitely (see PtyProcess.Dispose); if a test ever hangs again it
        # produces a hang report naming the test instead of a silent 30-minute timeout.
        run: dotnet test Pty.Net.slnx -c Release --no-build --no-restore --nologo ${{ matrix.os == 'windows-latest' && '--blame-hang --blame-hang-timeout 3m' || '' }}

  # Linux 上的 libc 差异由容器矩阵覆盖：同一套 #if LINUX 代码路径要分别在 glibc
  # (sdk:10.0，基于 Ubuntu) 与 musl (sdk:10.0-alpine，基于 Alpine) 上验证。
  # POSIX_SPAWN_SETSID 在两种 libc 上都是 0x80，但 musl 不导出 glibc 的
  # posix_spawn_file_actions_addclosefrom_np，所以 fd 隔离统一用标准 addclose
  # 逐 fd 关闭至 min(RLIMIT_NOFILE, cap)，两端行为一致。此 job 跑红即表示 musl
  # 与这些假设不符。
  # 测试步骤将 fd 硬+软上限压到 512（ulimit）：小于默认 1024，把 fd 隔离循环的
  # 真实上界逼到 RLIMIT_NOFILE——若循环仍按固定 1024 跑，glibc addclose 对
  # fd >= 上限会报 EBADF 导致整个 spawn 失败，从而暴露硬编码上界的缺陷。
  # 容器默认以 root 运行，而测试用 bash 的 '$' 提示符作 ReadUntil 标记（root 下是
  # '#'），所以建 testuser 并以该用户跑——与仓库根 Dockerfile 的做法一致。
  test-container:
    name: Test (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - mcr.microsoft.com/dotnet/sdk:10.0        # glibc (Ubuntu 24.04)
          - mcr.microsoft.com/dotnet/sdk:10.0-alpine # musl (Alpine)
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare non-root user
        run: |
          set -e
          # The Alpine SDK image ships no bash (busybox /bin/sh only) and the test
          # suite drives interactive /bin/bash sessions — install it where apk exists,
          # which is a no-op on the Debian-based glibc image.
          if command -v apk >/dev/null 2>&1; then apk add --no-cache bash; fi
          id testuser >/dev/null 2>&1 || useradd -m testuser || adduser -D testuser
          chown -R testuser:testuser "$GITHUB_WORKSPACE"

      - name: Test (as testuser)
        # Lower only the SOFT fd limit (ulimit -Sn): sysconf(_SC_OPEN_MAX), which glibc's
        # addclose validates against, tracks the soft limit. Lowering the HARD limit
        # would need CAP_SYS_RESOURCE, which the container's users lack — and it is not
        # needed to exercise the constrained-fd path.
        run: su testuser -s /bin/sh -c 'cd "$GITHUB_WORKSPACE" && ulimit -Sn 512 && dotnet test Pty.Net.slnx -c Release --nologo'
